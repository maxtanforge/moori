# Include in the gateway's nginx http context.
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
server {
    listen 80;
    server_name moori.example.com;
    return 308 https://moori.example.com$request_uri;
}
server {
    listen 443 ssl;
    server_name moori.example.com;
    ssl_certificate /etc/nginx/certs/moori.example.com.pem;
    ssl_certificate_key /etc/nginx/certs/moori.example.com.key;
    add_header Strict-Transport-Security "max-age=31536000" always;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    client_max_body_size 2m;
    proxy_read_timeout 90s;
    proxy_send_timeout 90s;
    proxy_buffering off;

    location / {
        proxy_pass http://127.0.0.1:8080;
    }

    # Browser import and Agent export both stream a tar body through Moori.
    location ~ ^/(api/v1/nodes/[^/]+/image-transfers/[^/]+|agent/v1/operations/[^/]+/image-archive)$ {
        proxy_pass http://127.0.0.1:8080;
        client_max_body_size 8g;
        proxy_request_buffering off;
        client_body_timeout 16m;
        send_timeout 16m;
        proxy_read_timeout 16m;
        proxy_send_timeout 16m;
    }

    location /agent/v1/log-stream/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_request_buffering off;
        client_max_body_size 0;
        client_body_timeout 31m;
        proxy_read_timeout 31m;
        proxy_send_timeout 31m;
    }

    location ~ ^/api/v1/nodes/[^/]+/containers/[^/]+/log-stream$ {
        proxy_pass http://127.0.0.1:8080;
        proxy_read_timeout 31m;
    }
}
